# Kodus reverse proxy — kodus.askelie.in
#
# This runs on the HOST's nginx (not inside the docker-compose stack), and
# proxies to the ports docker-compose publishes on 127.0.0.1:
#   - kodus-web  -> WEB_PORT           (3000)
#   - api        -> API_PORT           (3001)
#   - webhooks   -> API_WEBHOOKS_PORT  (3332)
#
# Subdomains used (matches docs.kodus.io/how_to_deploy/en/deploy_kodus/reverse_proxy):
#   kodus.askelie.in      -> web app
#   api.kodus.askelie.in  -> API, with /<provider>/webhook paths routed to the
#                            webhooks service instead (no dedicated webhook
#                            subdomain needed — the webhook paths don't
#                            collide with any API route).
#
# Install:
#   sudo cp kodus.askelie.in.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/kodus.askelie.in.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d kodus.askelie.in -d api.kodus.askelie.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# After certbot runs it will rewrite the `listen`/`ssl_certificate` lines below
# to point at /etc/letsencrypt/live/kodus.askelie.in/. The ssl_certificate
# paths below assume that layout; adjust if you provision certs differently.
#
# Matching .env changes:
#   WEB_HOSTNAME_API=api.kodus.askelie.in
#   WEB_PORT_API=443
#   NEXTAUTH_URL=https://kodus.askelie.in
#   API_FRONTEND_URL=https://kodus.askelie.in
#   API_GITHUB_CODE_MANAGEMENT_WEBHOOK=https://api.kodus.askelie.in/github/webhook
#   API_GITLAB_CODE_MANAGEMENT_WEBHOOK=https://api.kodus.askelie.in/gitlab/webhook
#   GLOBAL_BITBUCKET_CODE_MANAGEMENT_WEBHOOK=https://api.kodus.askelie.in/bitbucket/webhook
#   GLOBAL_AZURE_REPOS_CODE_MANAGEMENT_WEBHOOK=https://api.kodus.askelie.in/azure-repos/webhook
#   API_FORGEJO_CODE_MANAGEMENT_WEBHOOK=https://api.kodus.askelie.in/forgejo/webhook

# Handles the empty Upgrade header case correctly (standard nginx websocket recipe).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect for both hostnames
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kodus.askelie.in api.kodus.askelie.in;

    # Let certbot's HTTP-01 challenge through before redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Web app — kodus.askelie.in -> 127.0.0.1:3000
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kodus.askelie.in;

    ssl_certificate     /etc/letsencrypt/live/kodus.askelie.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodus.askelie.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
# API — api.kodus.askelie.in -> 127.0.0.1:3001
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.kodus.askelie.in;

    ssl_certificate     /etc/letsencrypt/live/kodus.askelie.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodus.askelie.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Code review diffs / webhook payloads can be sizeable.
    client_max_body_size 50m;

    # Webhook events (GitHub/GitLab/Bitbucket/Azure Repos/Forgejo) go to the
    # separate webhooks service on 3332 instead of the API on 3001.
    location ~ ^/(github|gitlab|bitbucket|azure-repos|forgejo)/webhook {
        proxy_pass http://127.0.0.1:3332;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook event processing can run long (see
        # WORKFLOW_QUEUE_WEBHOOK_PROCESS_TIMEOUT_MS in .env.example).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
