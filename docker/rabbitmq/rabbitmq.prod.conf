# RabbitMQ config mounted over /etc/rabbitmq/rabbitmq.conf by docker-compose.yml.
#
# Why this file exists: the published image
# (ghcr.io/kodustech/kodus-rabbitmq:4.2.2-kodus) bakes in
# `disk_free_limit.relative = 1.20`, which requires free disk >= 1.2x TOTAL
# SYSTEM RAM before RabbitMQ will accept publishes. On a high-RAM host that
# false-triggers the free-disk alarm even with tens of GB genuinely free, and a
# raised alarm silently blocks ALL publishing — publishers see only a bare
# "timeout" from amqp-connection-manager, with no hint that disk is involved.
# See docs/bugs/0006 for the full trail.
#
# Why a file and not an env var: RabbitMQ dropped configuration via
# `RABBITMQ_*` environment variables in 3.9. On 4.x, `RABBITMQ_DISK_FREE_LIMIT`
# is read by nothing — it is silently ignored, the container boots clean, and
# the baked-in relative limit stays in force. A config-file mount is the only
# reliable override.
#
# This started as a copy of docker/rabbitmq/rabbitmq.conf (the source of the
# image's baked config) with the one disk_free_limit line changed. If the
# published image's config ever drifts from it, settings present only in the
# image would be lost by this mount. Check before recreating the container,
# while it is still running on the image's own config:
#
#   docker compose exec rabbitmq cat /etc/rabbitmq/rabbitmq.conf \
#     | diff - docker/rabbitmq/rabbitmq.prod.conf
#
# The only expected difference is the disk_free_limit line (plus this header).
#
# Verify the effective value after recreating:
#
#   docker compose exec rabbitmq rabbitmq-diagnostics environment | grep -i disk_free_limit
#   docker compose exec rabbitmq rabbitmq-diagnostics check_alarms

## Basic security
loopback_users.guest = false

## Listeners
listeners.tcp.default = 5672

## Management UI
management.tcp.ip   = 0.0.0.0
management.tcp.port = 15672

## Prometheus (native metrics)
prometheus.tcp.ip   = 0.0.0.0
prometheus.tcp.port = 15692

## Limits (tunable per environment)
channel_max                        = 2048
vm_memory_high_watermark.relative  = 0.40
# Absolute floor rather than RAM-relative: the limit should track queue/message
# volume, not host RAM. 2GB is generous for Kodus's message sizes.
disk_free_limit.absolute           = 2GB
cluster_partition_handling         = pause_minority
